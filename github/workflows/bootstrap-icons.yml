name: bootstrap-icons
# 图标 PNG 是二进制文件，无法随代码快照一起上传，故以 base64 文本形式存放在 assets/icons.b64。
# 本任务负责把它们还原成真正的 PNG 并提交回仓库；PNG 齐全后再次运行不会产生新提交。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/icons.b64'
      - '.github/workflows/bootstrap-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode icons from base64
        run: |
          python3 - << 'EOF'
          import base64, json, pathlib
          data = json.loads(pathlib.Path('assets/icons.b64').read_text())
          for name, b64 in data.items():
              pathlib.Path(name).write_bytes(base64.b64decode(b64))
              print('wrote', name)
          EOF
      - name: Commit if icons changed
        run: |
          if git diff --quiet -- icon-192.png icon-512.png && git ls-files --error-unmatch icon-192.png >/dev/null 2>&1; then
            echo "图标无变化"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add icon-192.png icon-512.png
            git commit -m "assets: 还原图标 PNG（由 base64 生成）"
            git push
          fi
