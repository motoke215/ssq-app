<!doctype html><html lang="zh"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6bff"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f8;--c:#fff;--t:#1d2330;--m:#6b7385;--r:#d93a3a;--b:#2f6bff;--bd:#e3e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--c:#1d222b;--t:#e8ebf1;--m:#97a0b3;--bd:#2c3340}}
:root[data-theme="dark"]{--bg:#14171d;--c:#1d222b;--t:#e8ebf1;--m:#97a0b3;--bd:#2c3340}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{flex:1;background:var(--c);color:var(--t);border:0;padding:12px;font-size:17px}.seg button.on{background:var(--b);color:#fff}

.ball{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:600;margin:0 4px 4px 0;background:var(--r)}.ball.b{background:var(--b)}
.tk{padding:8px 0;border-bottom:1px dashed var(--bd)}.tk:last-of-type{border:0}.tk small{display:block;color:var(--m);font-size:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.kv span:last-child{text-align:right;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}td,th{border-bottom:1px solid var(--bd);padding:4px;text-align:center}
summary{cursor:pointer;font-weight:600}textarea{width:100%;height:80px;background:var(--bg);color:var(--t);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:14px}
.gsel{display:flex;gap:8px;margin-top:12px}.gsel select{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font-size:16px}
.acrow{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px;font-size:13px;color:var(--m)}.acrow input{margin-top:3px;width:16px;height:16px}
.gsel{display:flex;gap:8px;margin-top:12px}.gsel select{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font-size:16px}
.acrow{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px;font-size:13px;color:var(--m)}.acrow input{margin-top:3px;width:16px;height:16px}
</style></head><body><div class="w">
<h1 id="ttl">双色球 · 智能选号</h1>
<div class="warn">本工具仅做个人历史数据分析与娱乐用途，开奖为独立随机事件，结果不构成任何押注建议。</div>
<div class="gsel"><select id="brand" onchange="onBrand()" aria-label="选择福彩或体彩"></select><select id="game" onchange="switchGame(this.value)" aria-label="选择彩种"></select></div>
<div class="card" style="margin-top:12px"><div class="seg"><button id="m1" class="on" onclick="setMode('single')">单式</button><button id="m2" onclick="setMode('compound')">复式</button></div>
<div id="mdesc" class="warn" style="margin:8px 0 4px"></div>
<label class="acrow"><input type="checkbox" id="ac" checked onchange="AC=this.checked;setMode(MODE)"><span>防撞号：避开生日号扎堆（1–31）、等差等规律号——中奖概率不变，但中了大奖时和别人分钱的人更少</span></label>
<div class="gsel" style="margin-top:6px"><select id="betn" onchange="setBetn(this.value)" aria-label="生成注数"><option value="1">单式 1 注</option><option value="3">单式 3 注</option><option value="5">单式 5 注</option><option value="10">单式 10 注</option><option value="20">单式 20 注</option></select><select id="pmode" onchange="setPmode(this.value)" aria-label="出号模式"><option value="strict">严格模式（回测把关）</option><option value="history">历史概率模式（娱乐）</option></select></div>
<label class="acrow"><input type="checkbox" id="myst" onchange="setMyst(this.checked)"><span>紫微易经：勾选后，结合紫微排盘与梅花易数给号码加权（传统文化娱乐推演，无科学预测依据）</span></label>
<div id="mystbox" style="display:none;margin:2px 0 6px"><div class="gsel" style="margin-top:4px"><input type="date" id="bdate" onchange="setBirth()" aria-label="出生日期（公历）" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font-size:15px"><select id="bhour" onchange="setBirth()" aria-label="出生时辰"></select></div>
<div class="warn" style="margin-top:4px">填公历出生日期与出生时辰，排盘只在本机进行、不上传。不填生日时只用梅花时间卦。</div></div>
<button id="go" onclick="gen()">生成号码</button></div>
<div id="out"></div>
<details class="card" ontoggle="if(this.open)analyze()"><summary>后台分析与数据（自动完成，无需操作）</summary>
<div id="an" style="margin-top:8px"></div><hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">
<div class="warn" id="gnote"></div>
<textarea id="ta" placeholder="粘贴新开奖数据…"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="g" onclick="doImport()">导入</button><input type="file" id="f" accept=".csv,.txt" onchange="doFile()" style="max-width:180px"><button class="g" onclick="clearData()">清除我导入的</button></div>
<div id="ds" class="warn" style="margin-top:6px"></div></details>
<div class="warn">如有购彩冲动，请理性对待；本工具不保证任何结果。</div></div>
<script>
// ===== 基础工具 =====
const $=id=>document.getElementById(id);
const sum=a=>a.reduce((x,y)=>x+y,0), mean=a=>a.length?sum(a)/a.length:0, srt=a=>[...a].sort((x,y)=>x-y);
const C=(n,k)=>{if(k<0||k>n)return 0;k=Math.min(k,n-k);let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return r};
const p2=x=>String(x).padStart(2,'0');
const fmt=x=>x>=1?x.toFixed(4):x.toExponential(2);

// ===== 彩种配置 =====
const GAMES={
 ssq:{brand:'福彩',name:'双色球',fk:6,fn:33,bk:1,bn:16,fl:'红球',bl:'蓝球',tot:17721088,base:null,dataFiles:['data-ssq.json','data.json'],note:'内置 2003 年至 2026-10-27 的全部开奖'},
 dlt:{brand:'体彩',name:'大乐透',fk:5,fn:35,bk:2,bn:12,fl:'前区',bl:'后区',tot:21425712,base:null,dataFiles:['data-dlt.json'],note:'内置 2007 年至 2026-10-26 的全部开奖'}
};
let GID='ssq', G=GAMES.ssq, H=[], EX=[], REM=[], RINFO=null, ENG=null, MODE='single', AC=true;
let PMODE='strict', BETN=5, MYST={on:false,birth:'',hour:0};
try{const _ms=JSON.parse(localStorage.getItem('ssq_mystic_v1')||'null');if(_ms)MYST=_ms;const _pm=localStorage.getItem('ssq_pmode_v1');if(_pm)PMODE=_pm;const _bn=+localStorage.getItem('ssq_betn_v1');if(_bn>=1&&_bn<=20)BETN=_bn}catch(e){}
let KEY='ssq_data_v1_ssq', RKEY='ssq_remote_v1_ssq';
const REMOTE_BASE='https://motoke215.github.io/ssq-app/';

// ===== 数据：内置 + 自动更新 + 手动导入，三层合并 =====
function pcg(s,g){return s.split(';').filter(Boolean).map(x=>{const[a,b,c,e]=x.split('|');return{i:a,d:b,f:c.match(/../g).map(Number),b:g.bk===1?[+e]:e.match(/../g).map(Number)}})}
function mergeH(){const m=new Map(G.base.map(x=>[x.i,x]));REM.forEach(x=>m.set(x.i,x));EX.forEach(x=>m.set(x.i,x));H=[...m.values()].sort((a,b)=>a.i<b.i?-1:1);ENG=null}
function loadH(){try{EX=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){EX=[]}}
function saveH(){mergeH();try{localStorage.setItem(KEY,JSON.stringify(EX))}catch(e){}}
function loadRemoteCache(){try{const j=JSON.parse(localStorage.getItem(RKEY)||'null');if(j&&j.records){REM=pcg(j.records,G);RINFO={updated:j.updated||'',latest:j.latest||'',cached:true}}}catch(e){REM=[]}}
async function autoUpdate(){const urls=[];G.dataFiles.forEach(f=>urls.push('./'+f));G.dataFiles.forEach(f=>urls.push(REMOTE_BASE+f));
 for(const url of urls){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch(url,{cache:'no-store',signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const j=await r.json();if(!j||typeof j.records!='string'||!j.records)continue;const rows=pcg(j.records,G);if(!rows.length)continue;const latest=rows[rows.length-1].i;if(H.length&&latest<H[H.length-1].i)continue;REM=rows;RINFO={updated:j.updated||'',latest:j.latest||latest,cached:false};try{localStorage.setItem(RKEY,JSON.stringify({records:j.records,updated:j.updated||'',latest:j.latest||latest}))}catch(e){}mergeH();status();return}catch(e){}}}
function parse(t){const out=[],D=/\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}/;for(const ln of t.split(/\n/)){const d=ln.match(D),n=ln.replace(D,' ').match(/\d+/g);if(!n)continue;const i=n.findIndex(x=>x.length>=5&&x.length<=7);if(i<0)continue;const v=n.slice(i+1,i+1+G.fk+G.bk).map(Number);if(v.length<G.fk+G.bk)continue;const f=srt(v.slice(0,G.fk)),b=srt(v.slice(G.fk));if(new Set(f).size==G.fk&&f.every(x=>x>=1&&x<=G.fn)&&new Set(b).size==G.bk&&b.every(x=>x>=1&&x<=G.bn))out.push({i:n[i].slice(-5),d:d?d[0]:'',f,b})}return out}
function status(){$('ds').textContent=`${G.name}：共 ${H.length} 期，最新 ${H[H.length-1].i} 期${RINFO?'（自动更新'+(RINFO.cached?'·缓存':'')+(RINFO.updated?'，'+RINFO.updated:'')+'）':''}${EX.length?'（含你导入的 '+EX.length+' 期）':''}`}
function addRows(rows){if(!rows.length){$('ds').textContent='未识别到有效数据：每行需含期号、'+G.fk+' 个'+G.fl+'和 '+G.bk+' 个'+G.bl;return}rows.forEach(x=>{EX=EX.filter(e=>e.i!==x.i);EX.push(x)});saveH();status();$('ds').textContent='导入 '+rows.length+' 期；'+$('ds').textContent;analyze()}
function doImport(){addRows(parse($('ta').value));$('ta').value=''}
async function doFile(){const f=$('f').files[0];if(f)addRows(parse(await f.text()))}
function clearData(){if(confirm('确定清除你自己导入的数据？内置与自动更新的数据会保留。')){EX=[];saveH();status();analyze()}}

// ===== 多通道信号：每个通道给出一套号码概率分布 =====
// 通道增减只改这里；每个通道都要过 learn() 的逐期回测，赢不了随机权重自动归零。
const SN=['短期热号','长期热号','衰减热度','遗漏回补','邻重号转移','尾数热度','分区轮动'];
const norm=v=>{const s=sum(v.slice(1));return v.map((x,i)=>i?x/s:0)};
const zoneOf=(x,size)=>Math.min(2,Math.floor((x-1)/(size/3)));
function cnt(h,size,n,dec){const v=Array(size+1).fill(0),m=h.length;for(let j=Math.max(0,m-n);j<m;j++){const w=dec?Math.pow(dec,m-1-j):1;for(const x of h[j])v[x]+=w}return v}
function sigs(h,size,k){const E=size/k,s=[],sm=a=>a.map((x,i)=>i?x+1:0);
 s.push(norm(sm(cnt(h,size,30,0))));                                   // 1 短期热号：近30期频率
 s.push(norm(sm(cnt(h,size,300,0))));                                  // 2 长期热号：近300期频率
 s.push(norm(cnt(h,size,400,.97).map((x,i)=>i?x+.3:0)));                // 3 衰减热度：越近权重越高
 const g=Array(size+1).fill(0);for(let x=1;x<=size;x++){let o=0;for(let j=h.length-1;j>=0&&!h[j].includes(x);j--)o++;g[x]=.3+Math.min(o/E,3)}s.push(norm(g)); // 4 遗漏回补
 const L=h[h.length-1],m=h.length,a=[1,1,1],b=[2,2,2],cl=(P,x)=>P.includes(x)?0:(P.includes(x-1)||P.includes(x+1)?1:2);
 for(let j=Math.max(1,m-500);j<m;j++){const P=h[j-1],N=h[j];for(let x=1;x<=size;x++){const c=cl(P,x);if(N.includes(x))a[c]++;b[c]++}}
 const t=Array(size+1).fill(0);for(let x=1;x<=size;x++)t[x]=a[cl(L,x)]/b[cl(L,x)];s.push(norm(t)); // 5 邻重号转移
 const df=Array(10).fill(0),dg=Array(10).fill(0);for(let x=1;x<=size;x++)dg[x%10]++;for(const row of h.slice(-300))for(const x of row)df[x%10]++;
 const tv=Array(size+1).fill(0);for(let x=1;x<=size;x++)tv[x]=df[x%10]/dg[x%10]+1;s.push(norm(tv)); // 6 尾数热度：按尾数分组看冷热
 const zc=[0,0,0],zs=[0,0,0];for(let x=1;x<=size;x++)zs[zoneOf(x,size)]++;for(const row of h.slice(-30))for(const x of row)zc[zoneOf(x,size)]++;
 const zv=Array(size+1).fill(0);for(let x=1;x<=size;x++)zv[x]=zc[zoneOf(x,size)]/zs[zoneOf(x,size)]+.3;s.push(norm(zv)); // 7 分区轮动：近30期各区出号密度
 return s}
// 逐期回测给通道定权：只用当期之前的数据打分（无未来函数）；
// 采纳门槛 2026-10-28 收严：权重 = max(0, 平均增益 - 1 倍标准误)，宁可全归零也不把运气当实力。
function learn(sets,size,k){const T=Math.min(240,sets.length-60),g=SN.map(()=>[]);
 for(let t=sets.length-T;t<sets.length;t++){const S=sigs(sets.slice(Math.max(0,t-600),t),size,k);S.forEach((p,i)=>g[i].push(mean(sets[t].map(x=>Math.log(p[x]*size)))))}
 return g.map(a=>{const m=mean(a),se=Math.sqrt(mean(a.map(x=>(x-m)**2))/a.length);return{m,se,w:Math.max(0,m-se)}})}
function blend(S,res,size){const w=res.map(r=>r.w),W=sum(w),g=W/(W+.02),p=Array(size+1).fill(0);for(let x=1;x<=size;x++){let m=0;if(W>0)S.forEach((s,i)=>m+=w[i]/W*s[x]);p[x]=(1-g)/size+g*m}return p}
// 历史概率模式：不经回测把关，7 个通道等权混合（增益固定 0.85 向均匀分布收缩），属娱乐风格
function blendEq(S,size){const p=Array(size+1).fill(0);for(let x=1;x<=size;x++){let m=0;S.forEach(s=>m+=s[x]/S.length);p[x]=(1-.85)/size+.85*m}return p}

// ===== 结构通道：单双 / 大小 / 三区 / 012路 / 和值 / 跨度 / 连号 的历史分布 =====
function feats(r,size){return{sum:sum(r),odd:r.filter(x=>x%2).length,big:r.filter(x=>x*2>size).length,z:[0,1,2].map(z=>r.filter(x=>zoneOf(x,size)==z).length),m3:[0,1,2].map(z=>r.filter(x=>x%3==z).length),con:r.slice(1).filter((x,i)=>x-r[i]==1).length,span:r[r.length-1]-r[0]}}
function qtl(a,p){const s=srt(a);return s[Math.min(s.length-1,Math.floor(s.length*p))]}
function structModel(rs,size,k){const F=rs.map(r=>feats(r,size)),N=rs.length;
 const edges=(vals)=>{const e=[];for(let p=.1;p<.95;p+=.1)e.push(qtl(vals,p));return e};
 const tab=(vals,bins)=>{const t=Array(bins).fill(0);vals.forEach(v=>t[v]++);return t};
 const M={N,sumE:edges(F.map(f=>f.sum)),spanE:edges(F.map(f=>f.span)),
   oddT:tab(F.map(f=>f.odd),k+1),bigT:tab(F.map(f=>f.big),k+1),conT:tab(F.map(f=>f.con),k),
   zT:[0,1,2].map(z=>tab(F.map(f=>f.z[z]),k+1)),m3T:[0,1,2].map(z=>tab(F.map(f=>f.m3[z]),k+1)),
   ST:{sumLo:qtl(F.map(f=>f.sum),.05),sumHi:qtl(F.map(f=>f.sum),.95),spanLo:qtl(F.map(f=>f.span),.05),spanHi:qtl(F.map(f=>f.span),.95),
       oddLo:qtl(F.map(f=>f.odd),.1),oddHi:qtl(F.map(f=>f.odd),.9),bigLo:qtl(F.map(f=>f.big),.1),bigHi:qtl(F.map(f=>f.big),.9),
       zHi:qtl(F.map(f=>Math.max(...f.z)),.95),conHi:qtl(F.map(f=>f.con),.95)}};
 const bin=(e,v)=>{let i=0;while(i<e.length&&v>e[i])i++;return i};
 const sumT=tab(F.map(x=>bin(M.sumE,x.sum)),10),spanT=tab(F.map(x=>bin(M.spanE,x.span)),10);
 M.score=r=>{const f=feats(r,size);let s=0,c=0;const add=(t,idx)=>{s+=Math.log((t[idx]+1)/(N+t.length));c++};
   add(M.oddT,f.odd);add(M.bigT,f.big);add(M.conT,Math.min(f.con,k-1));
   f.z.forEach((v,z)=>add(M.zT[z],v));f.m3.forEach((v,z)=>add(M.m3T[z],v));
   s+=Math.log((sumT[bin(M.sumE,f.sum)]+1)/(N+10));c++;s+=Math.log((spanT[bin(M.spanE,f.span)]+1)/(N+10));c++;
   return s/c};
 return M}
function okS(r,ST){const f=feats(r,G.fn);return f.sum>=ST.sumLo&&f.sum<=ST.sumHi&&f.span>=ST.spanLo&&f.span<=ST.spanHi&&f.odd>=ST.oddLo&&f.odd<=ST.oddHi&&f.big>=ST.bigLo&&f.big<=ST.bigHi&&Math.max(...f.z)<=ST.zHi&&f.con<=ST.conHi}

// ===== 防撞号：估算一注号码会被多少人同时选（中奖时分钱的人数） =====
// 依据是公开常识：生日号（1-31，尤其1-12）被选得最多，32以上很少人选；
// 吉利号 6/8/9 偏热，4 偏冷；整齐的规律号（等差、全小号）跟买的人多。
// 这是启发式模型，不是官方销量数据；它不改变中奖概率，只降低中奖时被分薄的程度。
function popNum(x){let p=1;if(x<=12)p=1.45;else if(x<=31)p=1.2;else p=.55;if([6,8,9,16,18,28].includes(x))p*=1.18;if(x===4)p*=.85;return p}
function popNumB(x){let p=1;if([6,8,9].includes(x))p*=1.2;if(x===4)p*=.85;return p}
function comboPop(f,b){let p=mean(f.map(popNum))+.5*mean(b.map(popNumB));
 if(f.every(x=>x<=31))p+=.35;                                   // 全生日号：跟买最重
 const d=f.slice(1).map((x,i)=>x-f[i]);if(d.length>=3&&d.every(v=>v===d[0]))p+=.6; // 等差规律号
 let run=1,mx=1;for(const v of d){run=v===1?run+1:1;mx=Math.max(mx,run)}if(mx>=4)p+=.3; // 长连号
 return p}
function popBase(){let f=0,b=0;for(let x=1;x<=G.fn;x++)f+=popNum(x);for(let x=1;x<=G.bn;x++)b+=popNumB(x);return f/G.fn+.5*(b/G.bn)}
const popLabel=v=>{const r=v/popBase();return r<.97?'低':(r<=1.08?'中':'高')};

// ===== 候选生成与多通道融合挑选 =====
function pick(p,k,ex=[]){const c=[],pool=[];for(let x=1;x<p.length;x++)if(!ex.includes(x))pool.push(x);while(c.length<k&&pool.length){let u=Math.random()*sum(pool.map(x=>p[x])),j=0;for(;j<pool.length-1&&(u-=p[pool[j]])>0;j++);c.push(pool[j]);pool.splice(j,1)}return srt(c)}
function candScore(f,b,pr,E){return mean(f.map(x=>Math.log(pr[x]*G.fn)))+.6*E.SM.score(f)-(AC?.55*comboPop(f,b):0)}
function genOne(pr,pb,E){let f,t=0;do{f=pick(pr,G.fk);t++}while(t<400&&!okS(f,E.ST));const b=pick(pb,G.bk);return{f,b,pop:comboPop(f,b)}}
function genSingle(pr,pb,E,n){const pool=[],seen=new Set();let att=0;
 while(pool.length<90&&att<6000){att++;const f=pick(pr,G.fk);if(!okS(f,E.ST))continue;const key=f.join(',');if(seen.has(key))continue;seen.add(key);const b=pick(pb,G.bk);pool.push({f,b,pop:comboPop(f,b),s:candScore(f,b,pr,E)})}
 pool.sort((a,b2)=>b2.s-a.s);const T=[],usedB=[];
 for(const c of pool){if(T.length>=n)break;
   if(T.some(x=>x.f.filter(v=>c.f.includes(v)).length>Math.floor(G.fk/2)))continue;      // 注间分散
   if(G.bk===1&&usedB.includes(c.b[0]))continue;                                          // 单蓝球不重复
   if(G.bk>1&&T.some(x=>x.b.filter(v=>c.b.includes(v)).length>=G.bk))continue;
   T.push(c);usedB.push(...c.b)}
 while(T.length<n){const c=genOne(pr,pb,E);if(!T.some(x=>x.f.join()===c.f.join()))T.push(c)}
 return T.slice(0,n).map(c=>({f:c.f,b:c.b,pop:c.pop}))}
function combs(a,r){const res=[];(function g(s,c){if(c.length==r){res.push(c);return}for(let i=s;i<a.length;i++)g(i+1,[...c,a[i]])})(0,[]);return res}
function genComp(pr,pb,E){let best=null;for(let i=0;i<300;i++){const f=pick(pr,G.fk+1),b=pick(pb,G.bk),ra=combs(f,G.fk).filter(c=>okS(c,E.ST)).length/C(G.fk+1,G.fk),s=ra*2+mean(f.map(x=>Math.log(pr[x]*G.fn)))-(AC?.55*comboPop(f,b):0);if(!best||s>best.s)best={s,f,b,ra,pop:comboPop(f,b)}}return[{f:best.f,b:best.b,ra:best.ra,pop:best.pop}]}

function win(fh,bh){if(GID==='ssq')return bh>=1||fh>=4;
 return fh===5||fh===4||fh===3||(fh===2&&bh>=1)||(fh===1&&bh===2)||(fh===0&&bh===2)}
function evFixed(){const Pf=[],Pb=[];for(let x=0;x<=G.fk;x++)Pf.push(C(G.fk,x)*C(G.fn-G.fk,G.fk-x)/C(G.fn,G.fk));for(let x=0;x<=G.bk;x++)Pb.push(C(G.bk,x)*C(G.bn-G.bk,G.bk-x)/C(G.bn,G.bk));
 if(GID==='ssq'){const h=Pb[1];return 3000*Pf[5]*h+200*(Pf[5]*(1-h)+Pf[4]*h)+10*(Pf[4]*(1-h)+Pf[3]*h)+5*h*(Pf[0]+Pf[1]+Pf[2])}
 return 10000*Pf[5]*Pb[0]+3000*Pf[4]*Pb[2]+300*Pf[4]*Pb[1]+200*Pf[3]*Pb[2]+100*Pf[4]*Pb[0]+15*(Pf[3]*Pb[1]+Pf[2]*Pb[2])+5*(Pf[3]*Pb[0]+Pf[2]*Pb[1]+Pf[1]*Pb[2]+Pf[0]*Pb[2])}
function drawN(n,k){const a=Array.from({length:n},(_,i)=>i+1);for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(n-i));[a[i],a[j]]=[a[j],a[i]]}return new Set(a.slice(0,k))}
function probs(T){const combos=T.reduce((s,t)=>s+C(t.f.length,G.fk)*C(t.b.length,G.bk),0),N=20000;let hit=0;
 for(let i=0;i<N;i++){const fd=drawN(G.fn,G.fk),bd=drawN(G.bn,G.bk);if(T.some(t=>win(t.f.filter(x=>fd.has(x)).length,t.b.filter(x=>bd.has(x)).length)))hit++}
 return{combos,cost:combos*2,p1:combos/G.tot,any:hit/N,ev:combos*evFixed()}}
