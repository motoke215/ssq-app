name: update-data
# 双色球每周二、四、日 21:15 开奖，大乐透每周一、三、六晚开奖（均为北京时间）。
# 脚本一次更新两个彩种，没有新开奖时不产生提交。
# 定时（cron 为 UTC）：每天 13:45 / 14:30 / 15:30 UTC（北京 21:45 / 22:30 / 23:30）各跑一次，
# 覆盖两个彩种的开奖当晚，并给数据源留出更新延迟的余地。
on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * *'
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest draw results (SSQ + DLT)
        run: python3 scripts/update_data.py
      - name: Commit if data changed
        run: |
          if git diff --quiet -- data-ssq.json data-dlt.json data.json; then
            echo "数据无变化，不提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data-ssq.json data-dlt.json data.json
            git commit -m "data: 自动更新开奖数据（双色球+大乐透）"
            git push
          fi
